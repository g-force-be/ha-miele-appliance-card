<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <title>Miele Appliance Card</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2c3036"/>
      <stop offset="1" stop-color="#1a1c20"/>
    </linearGradient>
    <linearGradient id="front" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fbfaf6"/>
      <stop offset=".55" stop-color="#efede6"/>
      <stop offset="1" stop-color="#dcd9d1"/>
    </linearGradient>
    <linearGradient id="chrome" x1=".15" y1="0" x2=".85" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset=".22" stop-color="#c3c9cf"/>
      <stop offset=".45" stop-color="#8d969f"/>
      <stop offset=".62" stop-color="#e9ecef"/>
      <stop offset=".82" stop-color="#9aa2aa"/>
      <stop offset="1" stop-color="#d7dbdf"/>
    </linearGradient>
    <radialGradient id="glass" cx=".38" cy=".32" r=".8">
      <stop offset="0" stop-color="#46505b"/>
      <stop offset=".7" stop-color="#1b1f24"/>
      <stop offset="1" stop-color="#101316"/>
    </radialGradient>
    <linearGradient id="arc" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4fa3e0"/>
      <stop offset=".6" stop-color="#4fc3c7"/>
      <stop offset="1" stop-color="#5fd38a"/>
    </linearGradient>
    <clipPath id="glassClip"><circle cx="256" cy="256" r="104"/></clipPath>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- tile -->
  <rect x="8" y="8" width="496" height="496" rx="112" fill="url(#bg)"/>
  <rect x="8.5" y="8.5" width="495" height="495" rx="111.5" fill="none" stroke="#ffffff" stroke-opacity=".08"/>

  <!-- progress track and arc (about three quarters done) -->
  <circle cx="256" cy="256" r="190" fill="none" stroke="#ffffff" stroke-opacity=".08" stroke-width="22"/>
  <circle cx="256" cy="256" r="190" fill="none" stroke="url(#arc)" stroke-width="22" stroke-linecap="round"
          stroke-dasharray="859.5 1193.8" transform="rotate(-90 256 256)" filter="url(#glow)"/>

  <!-- appliance front (lotus white disc) -->
  <circle cx="256" cy="256" r="164" fill="url(#front)"/>
  <!-- chrome door ring -->
  <circle cx="256" cy="256" r="140" fill="url(#chrome)"/>
  <circle cx="256" cy="256" r="140" fill="none" stroke="#6f7881" stroke-opacity=".5" stroke-width="2"/>
  <circle cx="256" cy="256" r="118" fill="#2a2f35"/>
  <!-- glass -->
  <circle cx="256" cy="256" r="104" fill="url(#glass)"/>
  <g clip-path="url(#glassClip)">
    <path d="M140 280 C 180 260, 215 300, 256 280 S 332 260, 372 280 L 372 368 L 140 368 Z" fill="#4fa3e0" fill-opacity=".55"/>
    <path d="M140 294 C 186 278, 222 314, 262 294 S 334 278, 372 296 L 372 368 L 140 368 Z" fill="#7cc0ef" fill-opacity=".35"/>
  </g>
  <!-- glass highlight -->
  <path d="M190 198 A 92 92 0 0 1 286 166" fill="none" stroke="#ffffff" stroke-opacity=".35" stroke-width="10" stroke-linecap="round"/>
  <!-- door handle -->
  <rect x="401" y="226" width="10" height="60" rx="5" fill="#c9cdd1"/>
  <rect x="401" y="226" width="10" height="60" rx="5" fill="none" stroke="#8a9299" stroke-opacity=".6"/>
</svg>
