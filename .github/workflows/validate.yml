# HACS's own check of this repository (hacs.json, the card file, description, topics, issues, README). It only reports;
# nothing is sent to HACS. A passing run is required before the repository can be proposed for the HACS default list.
name: Validate

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: hacs/action@main
        with:
          category: plugin
